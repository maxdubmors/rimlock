[workspace]
resolver = "3"
members = ["crates/rimlock-core", "crates/rimlock-core-wasm"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-3.0-only"
repository = "https://github.com/maxdubmors/rimlock"
publish = false

[workspace.dependencies]
# The wasm-bindgen CLI must be exactly this version; scripts/build-core.sh reads it from Cargo.lock.
wasm-bindgen = "=0.2.129"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.17"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }

[workspace.lints.rust]
# rimlock-core raises this to forbid; the wasm bindings may need a local #[expect].
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# restriction: a panic kills the WASM instance (engineering.md § Checks)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# exceptions only as #[expect(lint, reason = "…")]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"


# Argon2 at KeePassXC's defaults takes seconds unoptimised; the generator and Core tests run it.
[profile.dev.package.rust-argon2]
opt-level = 3

# The store bundle's Core (engineering.md § WASM build).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# The development Core: optimised, since Argon2 in debug is unusably slow, with debug assertions on.
[profile.dev-wasm]
inherits = "release"
debug-assertions = true
overflow-checks = true
