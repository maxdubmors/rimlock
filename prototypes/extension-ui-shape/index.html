<title>PROTOTYPE — rimlock Extension UI shape</title>
<!--
  PROTOTYPE — throwaway. Do not ship, do not build on.
  Question (rimlock #10 "Sketch the Extension UI shape"): what shape should the Extension UI take?
  Three structurally different variants of the whole Extension UI, switchable via ?variant=A|B|C
  (or the floating bar / arrow keys), hosted in a fake browser window with a fake login page.
  All state is in memory; reload resets it.
-->

    <p><b>Premise:</b> one surface, the toolbar popup (~380×600). Push/pop navigation like a phone app.
    What lands first is <i>matches for this site</i> + search; Groups are secondary (Browse tab).
    All editing, the Recycle Bin and the generator live in the popup too.</p>
    <p><b>Inline menu:</b> drops down automatically when a login field gets focus.</p>
    <p><b>Save prompt:</b> a card injected into the page near the toolbar (a popup cannot open itself everywhere).</p>
    <h4>Trade-offs</h4><ul>
    <li>+ One UI to build; popups behave the same in Chrome, Firefox and Safari.</li>
    <li>− A popup closes on any click outside it: a half-typed edit is lost; copying between page and popup is fiddly.</li>
    <li>− Small canvas for history, notes and custom fields.</li></ul>` },
  B: { name: 'Side panel · tree explorer', notes: `
    <p><b>Premise:</b> a persistent panel docked beside the page (Chrome <code>sidePanel</code>, Firefox <code>sidebar_action</code>).
    KeePassXC-like Group tree with Entries as leaves; selecting an Entry splits the panel with its detail; edit happens in place.
    Generator is a drawer under the header.</p>
    <p><b>Inline menu:</b> only an icon inside the field; the menu opens on click, never by itself.</p>
    <p><b>Save prompt:</b> a banner at the top of the panel; badge on the toolbar icon if the panel is closed.</p>
    <h4>Trade-offs</h4><ul>
    <li>+ Survives page interaction: copy fields while filling multi-step forms, edit without losing work.</li>
    <li>+ Least intrusive inline UI (fewer clickjacking surfaces).</li>
    <li>− Eats page width. Firefox's sidebar is shared with bookmarks/history. Safari has no side panel, so a popup fallback is needed anyway.</li></ul>` },
  C: { name: 'Quick popup + full-tab manager', notes: `

// fake TOTP: stable per 30 s window, not real RFC 6238
const code = s => { const w = Math.floor(Date.now() / 30000); let h = 7; for (const c of s + w) h = (h * 31 + c.charCodeAt(0)) >>> 0; return String(h % 1e6).padStart(6, '0'); };

// generator
const WORDS = 'acorn badge cobalt delta ember fable glider harbor ivory jasper kettle lantern marble nectar orbit pebble quartz raven saddle timber umber velvet walnut yonder zephyr anchor birch cinder dune falcon granite hollow island juniper kiln lagoon meadow nimbus otter prairie quill ridge spruce thistle'.split(' ');
const rnd = k => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % k; };
function pool() {
  const g = state.gen; let p = '';
  if (g.upper) p += g.noAmbig ? 'ABCDEFGHJKLMNPQRSTUVWXYZ' : 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (g.lower) p += g.noAmbig ? 'abcdefghijkmnpqrstuvwxyz' : 'abcdefghijklmnopqrstuvwxyz';
  if (g.digits) p += g.noAmbig ? '23456789' : '0123456789';
  if (g.symbols) p += '!@#$%^&*-_=+?';
  return p || 'abcdefghijklmnopqrstuvwxyz';
}
function generate() {
  const g = state.gen;
  if (g.mode === 'words') { let w = [...Array(g.words)].map(() => WORDS[rnd(WORDS.length)]); if (g.cap) w = w.map(x => x[0].toUpperCase() + x.slice(1)); return w.join(g.sep); }
  const p = pool(); return [...Array(g.length)].map(() => p[rnd(p.length)]).join('');
}
const bits = () => state.gen.mode === 'words' ? Math.round(state.gen.words * Math.log2(7776)) : Math.round(state.gen.length * Math.log2(pool().length));

    case 'a-entry': state.a.stack.push({ s: 'entry', id: d.id }); break;
    case 'a-pop': if (state.a.stack.length > 1) state.a.stack.pop(); break;
    case 'a-edit': startEdit(d.id); state.a.stack.push({ s: 'edit' }); break;
    case 'a-new': startEdit(null, d.g && d.g !== 'root' ? d.g : 'g-internet'); state.a.stack.push({ s: 'edit' }); break;
    case 'a-cancel': state.draft = null; state.a.stack.pop(); break;
    case 'a-save': { const isNew = !state.draft.id, id = saveDraft(); state.a.stack.pop(); if (isNew) state.a.stack.push({ s: 'entry', id }); break; }
    // B
    case 'b-toggle': b.open[d.g] = !b.open[d.g]; break;
    case 'b-sel': b.sel = d.id; b.editing = false; state.draft = null; touch(d.id); break;
    case 'b-close': b.sel = null; b.editing = false; state.draft = null; break;
    case 'b-edit': startEdit(b.sel); b.editing = true; break;
    case 'b-new': startEdit(null, 'g-internet'); b.editing = true; b.sel = null; break;
    case 'b-cancel': b.editing = false; state.draft = null; break;
    case 'b-save': { const id = saveDraft(); b.editing = false; b.sel = id; let g = G(E(id).group); while (g) { b.open[g.id] = true; g = G(g.parent); } break; }
    case 'b-gen': b.gen = !b.gen; break;
    // C
    case 'c-tab': c.tab = d.t; state.surfaceOpen = false; break;
    case 'close-mgr-tab': c.mgr = false; c.tab = 'page'; break;
    case 'open-mgr':
      c.mgr = true; c.tab = 'mgr'; state.surfaceOpen = false; state.inline = null; state.search = '';
      if (d.id) { c.group = E(d.id).group; c.sel = d.id; c.editing = false; c.detailTab = 'entry'; }
      if (d.new) { startEdit(null, 'g-internet'); c.editing = true; c.sel = null; }
      break;
    case 'c-group': c.group = d.g; c.sel = null; c.editing = false; state.search = ''; break;
    case 'c-sel': c.sel = d.id; c.editing = false; c.detailTab = 'entry'; state.draft = null; touch(d.id); break;
    case 'c-edit': startEdit(c.sel); c.editing = true; break;
    case 'c-new': startEdit(null, c.group === 'g-bin' || c.group === 'root' ? 'g-internet' : c.group); c.editing = true; c.sel = null; break;
    case 'c-cancel': c.editing = false; state.draft = null; break;
    case 'c-save': { const id = saveDraft(); c.editing = false; c.sel = id; c.group = E(id).group; break; }
    case 'c-gen-dialog': c.genDialog = !c.genDialog; break;
    case 'c-detail-tab': c.detailTab = d.t; break;
    case 'c-quick-regen': c.quickPw = generate(); break;
  }
  render();
}

setInterval(() => {
  document.querySelectorAll('[data-totp]').forEach(el => { el.textContent = fmtCode(code(el.dataset.totp)); });
  document.querySelectorAll('[data-left]').forEach(el => { el.textContent = left() + 's'; });
}, 1000);
render();
</script>
