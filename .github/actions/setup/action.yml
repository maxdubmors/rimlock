# The toolchain every job runs the repository's commands with, at the pinned versions:
# Node from .node-version, pnpm from packageManager, Rust from rust-toolchain.toml
# (docs/spec/engineering.md § Pinning and reproducibility).
name: Set up the pinned toolchain
description: Node, pnpm and Rust at the repository's pins, with their caches.

inputs:
  install:
    description: Whether to run pnpm install with the committed lockfile.
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: true

    # rustup is on the runner image; with no argument it installs the toolchain the
    # rust-toolchain.toml names, with its components and the wasm32 target.
    - name: Install the Rust toolchain
      shell: bash
      run: rustup toolchain install

    # target/tools holds the wasm-bindgen CLI that scripts/build-core.sh installs on first use.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
